<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fff;}
  a{color:inherit;text-decoration:none;}
  a:hover{opacity:0.7;}
  .work-card{transition:transform 300ms cubic-bezier(0.2,0.8,0.2,1);}
  .work-card:hover{transform:translate(-4px,-4px);}
</style>
</helmet>

<div style="min-height:100vh;background:#fff;font-family:'Inter',sans-serif;color:#111;">

  <header style="display:flex;align-items:center;justify-content:space-between;padding:28px 48px;border-bottom:3px solid #111;">
    <a href="HAM Hero.dc.html"><img src="assets/ham-logo.png" alt="HAM" style="height:56px;width:auto;"></a>
    <nav style="display:flex;align-items:center;gap:32px;">
      <a href="Work.dc.html" style="color:#111;font-size:15px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;border-bottom:3px solid #C81E2E;padding-bottom:4px;">{{ work }}</a>
      <a href="About.dc.html" style="color:#111;font-size:15px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;">{{ about }}</a>
      <a href="Contact.dc.html" style="color:#111;font-size:15px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;">{{ contact }}</a>
      <div style="display:flex;gap:0;border:2px solid #111;">
        <button onClick="{{ setEn }}" style="border:none;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;background:{{ enBg }};color:{{ enColor }};font-family:'JetBrains Mono',monospace;">EN</button>
        <button onClick="{{ setTr }}" style="border:none;border-left:2px solid #111;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;background:{{ trBg }};color:{{ trColor }};font-family:'JetBrains Mono',monospace;">TR</button>
      </div>
    </nav>
  </header>

  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:56px 48px 40px;border-bottom:3px solid #111;">
    <h1 style="margin:0;font-family:'Archivo Black',sans-serif;font-size:clamp(48px,9vw,140px);line-height:0.86;letter-spacing:-0.01em;text-transform:uppercase;">{{ headline }}</h1>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:220px;">
      <p style="margin:0;max-width:280px;text-align:right;color:#444;font-size:15px;line-height:1.5;font-family:'JetBrains Mono',monospace;">{{ subhead }}</p>
      <button onClick="{{ shuffle }}" style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;background:#111;color:#fff;border:none;padding:12px 22px;cursor:pointer;">{{ shuffleLabel }} ↻</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="10">
      <div class="work-card" style="position:relative;aspect-ratio:4/5;overflow:hidden;border:1.5px solid #111;background:#f2f2f2;">
        <img src="{{ item.src }}" alt="{{ item.title }}" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);" />
        <div style="position:absolute;left:0;right:0;bottom:0;padding:16px;background:#fff;border-top:2px solid #111;display:flex;align-items:baseline;justify-content:space-between;gap:10px;">
          <span style="font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.02em;">{{ item.title }}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#C81E2E;font-weight:700;">{{ item.index }}</span>
        </div>
      </div>
    </sc-for>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const T = {
  en: {
    work: 'Work', about: 'About', contact: 'Contact',
    headline: 'Selected work',
    subhead: 'Campaigns shot, styled, and framed to make people stop scrolling. Click shuffle — order is not sacred here.',
    shuffleLabel: 'Shuffle'
  },
  tr: {
    work: 'İşler', about: 'Hakkımızda', contact: 'İletişim',
    headline: 'Seçili işler',
    subhead: 'İnsanların kaydırmayı bırakmasını sağlayan kampanyalar. Karıştır\u2019a bas — sıra burada kutsal değil.',
    shuffleLabel: 'Karıştır'
  }
};

const BASE = [
  { src: 'uploads/BEST FRESH DRAFT BEER.jpg', title: 'Best Fresh Draft Beer' },
  { src: 'uploads/break free drink bomonti.jpg', title: 'Break Free — Drink Bomonti' },
  { src: 'uploads/freedom ıs under the cap.jpg', title: 'Freedom Is Under the Cap' },
  { src: 'uploads/BODRUM.jpg', title: 'Bodrum' },
  { src: 'uploads/ahtapt bodrum.jpg', title: 'Ahtapot Bodrum' },
  { src: 'uploads/aslan balığı fine dine 2.jpg', title: 'Aslan Balığı — Fine Dine' },
  { src: 'uploads/levrek fine dine.jpg', title: 'Levrek — Fine Dine' },
  { src: 'uploads/lionfish mockup sır.jpg', title: 'Lionfish Mockup' },
  { src: 'uploads/midye sushi.jpg', title: 'Midye Sushi' },
  { src: 'uploads/aged rısen baked.jpg', title: 'Aged, Risen, Baked' }
];

class Component extends DCLogic {
  state = {
    lang: (typeof localStorage !== 'undefined' && localStorage.getItem('ham_lang')) || 'en',
    order: BASE.map((_, i) => i)
  };

  setLang(lang) {
    localStorage.setItem('ham_lang', lang);
    this.setState({ lang });
  }

  shuffle() {
    const arr = [...this.state.order];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    this.setState({ order: arr });
  }

  renderVals() {
    const t = T[this.state.lang];
    const items = this.state.order.map((idx, pos) => ({
      ...BASE[idx],
      index: String(pos + 1).padStart(2, '0')
    }));
    return {
      ...t,
      items,
      enBg: this.state.lang === 'en' ? '#111' : '#fff',
      enColor: this.state.lang === 'en' ? '#fff' : '#111',
      trBg: this.state.lang === 'tr' ? '#111' : '#fff',
      trColor: this.state.lang === 'tr' ? '#fff' : '#111',
      setEn: () => this.setLang('en'),
      setTr: () => this.setLang('tr'),
      shuffle: () => this.shuffle()
    };
  }
}
</script>
</body>
</html>
