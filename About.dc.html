<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#111;}
  a{color:inherit;text-decoration:none;}
  a:hover{opacity:0.75;}
</style>
</helmet>

<div style="min-height:100vh;background:#111;font-family:'Inter',sans-serif;color:#fff;">

  <header style="display:flex;align-items:center;justify-content:space-between;padding:28px 48px;">
    <a href="HAM Hero.dc.html"><img src="assets/ham-logo.png" alt="HAM" style="height:56px;width:auto;"></a>
    <nav style="display:flex;align-items:center;gap:40px;">
      <a href="Work.dc.html" style="color:rgba(255,255,255,0.7);font-size:16px;font-weight:600;letter-spacing:0.02em;">{{ work }}</a>
      <a href="About.dc.html" style="color:#fff;font-size:16px;font-weight:600;letter-spacing:0.02em;border-bottom:2px solid #C81E2E;padding-bottom:4px;">{{ about }}</a>
      <a href="Contact.dc.html" style="color:rgba(255,255,255,0.7);font-size:16px;font-weight:600;letter-spacing:0.02em;">{{ contact }}</a>
      <div style="display:flex;gap:6px;border:1px solid rgba(255,255,255,0.25);border-radius:999px;padding:4px;">
        <button onClick="{{ setEn }}" style="border:none;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;background:{{ enBg }};color:{{ enColor }};">EN</button>
        <button onClick="{{ setTr }}" style="border:none;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;background:{{ trBg }};color:{{ trColor }};">TR</button>
      </div>
    </nav>
  </header>

  <div style="max-width:820px;padding:40px 48px 100px;">
    <h1 style="margin:0 0 28px;font-family:'Archivo Black',sans-serif;font-size:clamp(36px,6vw,72px);line-height:1.02;">{{ headline }}</h1>
    <p style="margin:0 0 20px;font-size:19px;line-height:1.6;color:rgba(255,255,255,0.75);">{{ p1 }}</p>
    <p style="margin:0 0 48px;font-size:19px;line-height:1.6;color:rgba(255,255,255,0.75);">{{ p2 }}</p>

    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(160px,1fr));gap:32px;padding-top:32px;border-top:1px solid rgba(255,255,255,0.12);">
      <div>
        <div style="font-family:'Archivo Black',sans-serif;font-size:40px;color:#C81E2E;">40+</div>
        <div style="font-size:15px;color:rgba(255,255,255,0.6);margin-top:6px;">{{ stat1 }}</div>
      </div>
      <div>
        <div style="font-family:'Archivo Black',sans-serif;font-size:40px;color:#C81E2E;">12</div>
        <div style="font-size:15px;color:rgba(255,255,255,0.6);margin-top:6px;">{{ stat2 }}</div>
      </div>
      <div>
        <div style="font-family:'Archivo Black',sans-serif;font-size:40px;color:#C81E2E;">3</div>
        <div style="font-size:15px;color:rgba(255,255,255,0.6);margin-top:6px;">{{ stat3 }}</div>
      </div>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const T = {
  en: {
    work: 'Work', about: 'About', contact: 'Contact',
    headline: 'We make the ordinary brief impossible to scroll past.',
    p1: 'HAM is a small creative agency working across food, drink, and lifestyle brands. We shoot, style, and design campaigns end to end — no hand-offs, no watered-down ideas by the time they reach a feed or a menu board.',
    p2: "Every project starts the same way: figure out what's actually interesting about the product, then build the whole campaign around that one thing.",
    stat1: 'Campaigns shot', stat2: 'Brands worked with', stat3: 'People, one camera'
  },
  tr: {
    work: 'İşler', about: 'Hakkımızda', contact: 'İletişim',
    headline: 'Sıradan bir briefi kaydırılamaz hale getiriyoruz.',
    p1: 'HAM, yiyecek, içecek ve yaşam tarzı markalarıyla çalışan küçük bir yaratıcı ajans. Kampanyaları uçtan uca biz çekiyor, biz stilize ediyor, biz tasarlıyoruz — bir feed\u2019e ya da menü tahtasına ulaştığında sulandırılmış hiçbir fikir olmuyor.',
    p2: 'Her proje aynı şekilde başlar: ürünle ilgili gerçekten ilginç olan şeyi bulmak, sonra tüm kampanyayı bu tek şey etrafında kurmak.',
    stat1: 'Çekilen kampanya', stat2: 'Birlikte çalışılan marka', stat3: 'Kişi, tek kamera'
  }
};

class Component extends DCLogic {
  state = { lang: (typeof localStorage !== 'undefined' && localStorage.getItem('ham_lang')) || 'en' };

  setLang(lang) {
    localStorage.setItem('ham_lang', lang);
    this.setState({ lang });
  }

  renderVals() {
    const t = T[this.state.lang];
    return {
      ...t,
      enBg: this.state.lang === 'en' ? '#fff' : 'transparent',
      enColor: this.state.lang === 'en' ? '#111' : '#fff',
      trBg: this.state.lang === 'tr' ? '#fff' : 'transparent',
      trColor: this.state.lang === 'tr' ? '#111' : '#fff',
      setEn: () => this.setLang('en'),
      setTr: () => this.setLang('tr')
    };
  }
}
</script>
</body>
</html>
